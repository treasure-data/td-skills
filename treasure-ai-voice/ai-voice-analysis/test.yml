# Behavior specifications, not executed staging results. Synthetic data only.
# Record commit, surface/build, role, scenario, pass/fail and actual tool trace.
skill: ai-voice-analysis
scenarios:
- name: Disconnected source is not bypassed
  description: The requested connector or approved CDP source is unavailable.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Request the deliverable with no usable connection or with access denied.
  expect: Explain the unavailable connection/access in the user language; do not invent data, request
    secrets in chat, switch profiles, or silently read a broader source. An offered alternate source requires
    its own access and explicit user choice before reading content.
- name: Japanese and English deliverables follow the request
  description: Use the same complete synthetic evidence with Japanese and English requests.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Generate the deliverable in each language; inspect chat, headings, visible HTML, and accessibility
    text.
  expect: Output prose follows the requested supported language from the first line; source quotations
    and proper names remain marked. English developer comments do not become an English preamble for a
    Japanese request. Error/empty outputs are not recorded as successful deliverables.
- name: Personal activity versus deal status routing
  description: Dedicated daily-report and analysis skills are installed.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Ask for the user's own weekly activity report for a manager.
  - Ask separately for the status/history of synthetic deal 0012 for a manager.
  expect: The personal activity request uses daily-report; the deal-specific status uses analysis through
    the connector, not CDP merely because it is manager-facing. Status is dated as of the reviewed recording,
    not asserted current CRM status.
- name: Non-admin and other-owner recordings are not assumed authorized
  description: Caller is non-admin; an organization-list action may silently return only own recordings.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Request team coverage and inspect action names, returned coverage, and subsequent get-recording calls.
  expect: Default discovery uses list_my_recordings where available. The response is not proof of admin/organization-wide
    coverage. No other-owner full-recording retrieval occurs without established access and selection
    confirmation. Record if list responses themselves contain content; do not claim they were content-free
    when they were not.
- name: Exact linkage and bounded pagination
  description: Own recordings contain opportunityId string 0012, string 12, and missing metadata across
    multiple pages.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Ask for opportunityId=0012 and inspect pagination and selected IDs.
  expect: Only the exact string 0012 matches. No invented server-side metadata/date filter is sent. Pagination
    boundaries and incomplete coverage are stated; unrelated transcripts are not fetched.
