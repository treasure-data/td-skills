# Behavior specifications, not executed staging results. Synthetic data only.
# Record commit, surface/build, role, scenario, pass/fail and actual tool trace.
skill: ai-voice-cdp-meeting-digest
scenarios:
- name: Disconnected source is not bypassed
  description: The requested connector or approved CDP source is unavailable.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Request the deliverable with no usable connection or with access denied.
  expect: Explain the unavailable connection/access in the user language; do not invent data, request
    secrets in chat, switch profiles, or silently read a broader source. An offered alternate source requires
    its own access and explicit user choice before reading content.
- name: Japanese and English deliverables follow the request
  description: Use the same complete synthetic evidence with Japanese and English requests.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Generate the deliverable in each language; inspect chat, headings, visible HTML, and accessibility
    text.
  expect: Output prose follows the requested supported language from the first line; source quotations
    and proper names remain marked. English developer comments do not become an English preamble for a
    Japanese request. Error/empty outputs are not recorded as successful deliverables.
- name: Preview meetings without fetching unapproved content
  description: A and B are authorized metadata candidates; only A is selected.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Ask for the digest, select only A from the metadata preview, and inspect actual queries/results.
  expect: Preview reads no summaries, actions, transcripts, or inferred titles. Content and exclusion
    queries retrieve only confirmed keys for A and the approved organization. B's transcript, summary,
    and actions never cross the tool boundary.
- name: CDP digest, one meeting, and personal deal review route separately
  description: All nine starter skills are installed.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Request an explicit exported-data multi-meeting digest.
  - Request one meeting's minutes.
  - Request a personal deal-specific review without CDP.
  expect: The requests route to meeting-digest, meeting-minutes, and analysis respectively. Shortened
    frontmatter retains these routing rules; reference examples do not substitute for pre-selection rules.
- name: Missing metadata and uncertain actions are not guessed
  description: A selected call crosses midnight; another summary has no permitted parent metadata; an
    action has no later completion evidence.
  setup:
  - Use synthetic recordings/export data only; record actual tool calls and returned fields.
  run:
  - Generate the selected digest with bounded same-recording transcript context when needed.
  expect: The approved call's relevant end context is not silently truncated by the recording-period filter.
    The orphan summary is not read without independent authorization. The action is not marked completed
    by silence or a related follow-up task.
