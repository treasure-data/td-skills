# Skill trigger test cases
# Format: prompt -> expected skill name
# Run with: ./tests/run-tests.sh
#
# Philosophy: Prompts should be realistic (what a real user would say).
# If a test fails, consider improving the skill description.

tests:
  # === SQL Skills ===

  - prompt: "Optimize my Trino query for better performance"
    expected: trino-optimizer

  - prompt: "Write a Trino query to count users by country"
    expected: trino

  - prompt: "Write a Hive query with lateral view explode"
    expected: hive

  - prompt: "Convert this Trino query to Hive"
    expected: trino-to-hive-migration

  - prompt: "How do I use td_interval for time-based filtering"
    expected: time-filtering

  - prompt: "Set up dbt with TD Trino"
    expected: dbt

  # === TDX CLI Skills ===

  - prompt: "Create a segment for users who purchased in the last 30 days"
    expected: segment

  - prompt: "Create a parent segment with customer attributes"
    expected: parent-segment

  - prompt: "Validate my segment YAML configuration"
    expected: validate-segment

  - prompt: "Push a composable audience for our Snowflake zero-copy setup"
    expected: cas

  - prompt: "Create a child segment under a Composable Audience Studio parent segment"
    expected: cas

  - prompt: "Create a customer journey with decision points and activations"
    expected: journey

  - prompt: "Pull and push journeys for our composable Snowflake audience"
    expected: cas

  - prompt: "Validate my journey YAML file"
    expected: validate-journey

  - prompt: "List all databases using tdx"
    expected: tdx-basic

  - prompt: "Build an AI agent with knowledge base tools"
    expected: foundry-agent

  - prompt: "Write tests for my TD AI agent"
    expected: foundry-agent-test

  - prompt: "Write an effective system prompt for my agent"
    expected: foundry-agent-prompt

  - prompt: "Configure connector_config for a Salesforce activation"
    expected: connector-config

  - prompt: "Set up an activation to export segment data to Google Ads"
    expected: activation

  - prompt: "Export my segment to S3 and join in each customer's recent purchases and page views alongside the profile columns"
    expected: activation

  - prompt: "Query parent segment data to analyze customer behaviors"
    expected: parent-segment-analysis

  - prompt: "Manage workflows using tdx wf commands"
    expected: workflow

  - prompt: "Classify last week's customer reviews from mydb.feedback as positive or negative with AI"
    expected: ai-decision

  - prompt: "Use tdx ai decision to score the urgency of each support ticket from a query"
    expected: ai-decision

  # === Workflow Skills ===

  - prompt: "Create a digdag workflow for daily ETL"
    expected: digdag

  - prompt: "Build a workflow that summarizes KPIs with LLM and posts to Slack"
    expected: llm-workflow

  # === SDK Skills ===

  - prompt: "Query TD from Python using pytd"
    expected: pytd

  - prompt: "Implement event tracking on my website with TD JavaScript SDK"
    expected: td-javascript-sdk

  # === Realtime Skills ===

  - prompt: "Set up RT 2.0 personalization end-to-end"
    expected: rt-setup-personalization

  - prompt: "Set up RT triggers for real-time event processing"
    expected: rt-setup-triggers

  - prompt: "Configure RT 2.0 for a parent segment"
    expected: rt-config

  - prompt: "Check RT enablement status for my parent segment"
    expected: rt-config-setup

  - prompt: "Configure RT event tables and key events"
    expected: rt-config-events

  - prompt: "Add RT attributes like counters and lists"
    expected: rt-config-attributes

  - prompt: "Configure RT ID stitching for profile merging"
    expected: rt-config-id-stitching

  - prompt: "Create an RT personalization service and entity"
    expected: rt-personalization

  - prompt: "Validate my RT personalization entity payload"
    expected: rt-personalization-validation

  - prompt: "Create an RT journey with event triggers"
    expected: rt-journey-create

  - prompt: "Configure webhook activations for my RT journey"
    expected: rt-journey-activations

  - prompt: "Monitor RT journey activations and debug failures"
    expected: rt-journey-monitor

  - prompt: "Overview of RT triggers and journeys"
    expected: rt-triggers

  - prompt: "Query activation logs to check for errors"
    expected: activations

  - prompt: "Query identity change logs for profile merges"
    expected: identity

  - prompt: "Find the most common stitching key values in my RT events"
    expected: identify-top-key-values

  - prompt: "Analyze canonical ID group sizes to detect over-stitching"
    expected: id-graph-canonical-id-size

  - prompt: "Check if individual IDs appear in multiple canonical ID groups"
    expected: id-graph-ids-to-canonical-id

  # === Email & Engage Skills ===

  - prompt: "Create an email campaign for my segment"
    expected: email-campaign

  - prompt: "Manage Engage campaigns using tdx engage commands"
    expected: engage

  - prompt: "Find recent hero images in Engage DAM before building my email campaign"
    expected: engage

  - prompt: "Copy the Engage email template from the Marketing Team workspace to the EMEA workspace"
    expected: engage

  # === Document Skills ===

  - prompt: "Create a PowerPoint presentation about our Q4 results"
    expected: pptx

  - prompt: "Generate a .pptx slide deck for my project proposal"
    expected: pptx

  - prompt: "Make a pitch deck with charts showing our growth metrics"
    expected: pptx

  - prompt: "I need slides for my team meeting tomorrow"
    expected: pptx

  - prompt: "Use this Google Slides template to create a Q3 business review deck: https://docs.google.com/presentation/d/ABC123/edit"
    expected: google-slides

  - prompt: "Fill in this Google Slides template with the bullet points from my brief"
    expected: google-slides

  - prompt: "Build a Google Slides deck from this template for my product launch"
    expected: google-slides

  - prompt: "Generate a presentation in Google Slides using the template I shared — pattern slides are already set up"
    expected: google-slides

  - prompt: "QA my deck before sharing it — I just filled a Google Slides template and want to make sure nothing is broken"
    expected: google-slides-review

  - prompt: "Is this deck ready? Check for placeholder leaks and stale template images"
    expected: google-slides-review

  # === Documentation Skills ===

  - prompt: "Generate documentation for my golden layer tables"
    expected: aps-doc-golden

  - prompt: "Document my ingestion workflow"
    expected: aps-doc-ingestion

  - prompt: "Document my staging transformation layer"
    expected: aps-doc-staging

  - prompt: "Document my hist-union workflow"
    expected: aps-doc-hist-union

  - prompt: "Document my ID unification process"
    expected: aps-doc-id-unification

  - prompt: "Document my CDP parent segment configuration"
    expected: aps-doc-master-segment

  - prompt: "Core documentation patterns for TD pipelines"
    expected: aps-doc-core

  # === Field Agent Skills ===

  - prompt: "Best practices for deploying a Field Agent to production"
    expected: field-agent-deployment

  - prompt: "Create documentation for my Field Agent"
    expected: field-agent-documentation

  - prompt: "Create a Plotly chart with TD color palette"
    expected: field-agent-visualization

  # === Analysis Skills ===

  - prompt: "Run SEO analysis on my website"
    expected: seo-analysis

  - prompt: "Create a grid dashboard with KPIs and charts"
    expected: grid-dashboard

  - prompt: "Create an action report with recommendations"
    expected: action-report

  # === Data Governance Skills ===

  - prompt: "Generate column descriptions for my data dictionary"
    expected: data-dictionary

  - prompt: "Auto-tag schemas with policy tags for compliance"
    expected: schema-auto-tagger

  # === Studio Skills ===

  - prompt: "Create a new skill for Treasure Studio"
    expected: skill-creator

  - prompt: "Set up a scheduled agent in Treasure Work to run a daily report"
    expected: work-agent

  - prompt: "Create a Graflow workflow to scan accounts and alert for churn risk"
    expected: graflow

  - prompt: "Build an agentic workflow that checks HubSpot and sends Slack alerts"
    expected: graflow

  - prompt: "Set up a multi-step automation pipeline with AI decision points"
    expected: graflow

  - prompt: "What is Portal in Treasure Work and how do I get started?"
    expected: portal-guide

  - prompt: "My portal tab is empty and there's no button to add anything"
    expected: portal-guide

  # negative — must NOT route to portal-guide
  - prompt: "Build me a dashboard of last month's revenue with KPI tiles"
    expected: grid-dashboard

  - prompt: "Build an interactive dashboard component to visualize ingestion volume"
    expected: react-dashboard

  # === FDE AI Signals & Custom Agent Skills ===

  - prompt: "Set up RFM segmentation for our customers"
    expected: fde-rfm

  - prompt: "Help me find our best and at-risk customers with an RFM model"
    expected: fde-rfm

  - prompt: "Set up personalized product recommendations for each customer"
    expected: fde-nbp

  - prompt: "Start a Next Best Product project"
    expected: fde-nbp

  - prompt: "Set up multi-touch attribution to measure which channels drive conversions"
    expected: fde-mta

  - prompt: "Configure an MTA workflow with Markov and Shapley models"
    expected: fde-mta

  - prompt: "Set up next best action scores for the best time and channel to contact each customer"
    expected: fde-nba-scores

  - prompt: "Start an NBA engagement scores project"
    expected: fde-nba-scores

  - prompt: "Build a churn prediction model for our customers"
    expected: fde-classifier

  - prompt: "Set up a lead scoring propensity model"
    expected: fde-classifier

  - prompt: "Find duplicate customers that deterministic IDU missed because of typos or changed email addresses"
    expected: fde-prob-idu

  - prompt: "Set up probabilistic identity matching across our customer records"
    expected: fde-prob-idu

  - prompt: "Set up an audience agent for our parent segment"
    expected: fde-custom-audience-agent

  - prompt: "Build an AI analyst that helps our marketers analyze customers and build segments"
    expected: fde-custom-audience-agent

  - prompt: "Convert our Treasure Insights .dash export into an HTML dashboard"
    expected: fde-custom-dashboard-builder

  - prompt: "Turn this dashboard screenshot into a custom HTML dashboard on our TD data"
    expected: fde-custom-dashboard-builder

  # === Treasure AI Voice Skills ===

  # --- Connector skills ---

  - prompt: "AI Voice の録音から、A社との商談がこれまでどう進んできたか、今の状況と次の一手をまとめて"
    expected: ai-voice-analysis

  - prompt: "From my AI Voice recordings, summarize the product feedback customers gave this month"
    expected: ai-voice-analysis

  - prompt: "AI Voice の録音で、externalMetadata の opportunityId が 0012 の商談の経緯を教えて"
    expected: ai-voice-analysis

  - prompt: "AI Voice の録音から、さっきの会議の議事録を作って"
    expected: ai-voice-meeting-minutes

  - prompt: "Turn this AI Voice recording into meeting minutes with decisions and action items"
    expected: ai-voice-meeting-minutes

  - prompt: "AI Voice の録音から、A社との商談メモを作って"
    expected: ai-voice-sales-call-notes

  - prompt: "What should I enter in Salesforce from the sales call I just recorded in AI Voice"
    expected: ai-voice-sales-call-notes

  - prompt: "さっき録音した店頭での接客を、接客記録にまとめて"
    expected: ai-voice-sales-call-notes

  - prompt: "A社との打ち合わせの録音から、お礼メールを書いて"
    expected: ai-voice-followup-email

  - prompt: "Draft a follow-up email from the AI Voice recording of my meeting with Company A"
    expected: ai-voice-followup-email

  - prompt: "今日の AI Voice の録音から日報を書いて"
    expected: ai-voice-daily-report

  - prompt: "Write my weekly report from this week's AI Voice recordings"
    expected: ai-voice-daily-report

  - prompt: "AI Voice の録音から、さっきの商談で誰がどれだけ話したかを見せて"
    expected: ai-voice-talk-analysis

  - prompt: "Show the talk-to-listen ratio and interruptions of my recorded sales call"
    expected: ai-voice-talk-analysis

  # --- CDP skills ---

  - prompt: "AI Voice のエクスポートデータで、recordings テーブルには何が入っている?"
    expected: ai-voice-cdp-table-guide

  - prompt: "How do I join the AI Voice tables exported to Treasure Data"
    expected: ai-voice-cdp-table-guide

  - prompt: "AI Voice のエクスポートデータから、先月の会議をまとめて"
    expected: ai-voice-cdp-meeting-digest

  - prompt: "List open action items from our weekly meetings in the exported AI Voice tables"
    expected: ai-voice-cdp-meeting-digest

  - prompt: "AI Voice の利用状況を出して。使われていない端末も知りたい"
    expected: ai-voice-cdp-usage-report

  - prompt: "AI Voice usage report: who is recording how much last month"
    expected: ai-voice-cdp-usage-report

  - prompt: "AI Voice のエクスポートデータから、先月のカスハラの疑いがある録音を探して"
    expected: ai-voice-cdp-harassment-dashboard

  - prompt: "Find recordings with suspected customer harassment at our store last month"
    expected: ai-voice-cdp-harassment-dashboard

  - prompt: "店舗で威圧的なお客様がいなかったか見たい"
    expected: ai-voice-cdp-harassment-dashboard

  # --- Pairs that are easy to confuse ---

  # One meeting (connector) vs. many meetings in a period (CDP)
  - prompt: "AI Voice で録音した3時の打ち合わせをまとめて"
    expected: ai-voice-meeting-minutes

  - prompt: "AI Voice のエクスポートデータから、今月の定例の決定事項を一覧にして"
    expected: ai-voice-cdp-meeting-digest

  # Minutes vs. talk analysis of the same call
  - prompt: "AI Voice の録音から、さっきの通話の沈黙と被りを数えて"
    expected: ai-voice-talk-analysis

  # Sales call notes vs. general minutes
  - prompt: "AI Voice の録音から、SFA に入れる商談の内容をまとめて"
    expected: ai-voice-sales-call-notes

  # The user's own week, written for a manager, is a weekly report.
  - prompt: "今週の AI Voice の録音から、上長向けの活動報告をまとめて"
    expected: ai-voice-daily-report

  # Per-person counts from the export: usage report vs. table guide
  - prompt: "AI Voice のエクスポートしたテーブルで、人ごとの録音数を出す SQL を書きたい"
    expected: ai-voice-cdp-table-guide

  - prompt: "誰が AI Voice をどれくらい使っているかレポートにして"
    expected: ai-voice-cdp-usage-report

  # Manager-facing reports follow the subject: own activity vs. a customer, deal, or project
  - prompt: "AI Voice の録音から、今週の自分の活動を上長に報告できる形でまとめて"
    expected: ai-voice-daily-report

  - prompt: "AI Voice の録音から、プロジェクトXの進捗を上長に報告できる形で整理して"
    expected: ai-voice-analysis

  # "For managers" alone does not move a request to the CDP skills
  - prompt: "管理者向けに、A社との商談の状況を AI Voice の録音からまとめて"
    expected: ai-voice-analysis

  # A short request without "AI Voice", listed in the description
  - prompt: "直近の打ち合わせのお礼メールを書いて"
    expected: ai-voice-followup-email
